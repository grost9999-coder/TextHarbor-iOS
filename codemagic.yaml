workflows:
  ios-unsigned-check:
    name: 字捕手 iOS 編譯檢查（免簽署）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: 檢查 Xcode 專案
        script: |
          xcodebuild -version
          xcodebuild -list -project TextHarbor.xcodeproj
      - name: 編譯 iOS Simulator App（免簽署）
        script: |
          set -o pipefail
          xcodebuild \
            -project TextHarbor.xcodeproj \
            -scheme TextHarbor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/text-harbor-build.log"
    artifacts:
      - text-harbor-build.log
      - DerivedData/Build/Products/Debug-iphonesimulator/*.app

  ios-testflight:
    name: 字捕手 TestFlight 發布
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic-ClearPocket
    environment:
      xcode: latest
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.grost9999.textharbor
    scripts:
      - name: 產生字捕手暫用 App Store 圖示
        script: |
          swift scripts/generate-app-icon.swift
      - name: 設定新版 Build Number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_NUMBER" TextHarbor/Info.plist
      - name: 套用 Apple Distribution 簽署
        script: |
          xcode-project use-profiles
      - name: 建置簽署的 iPhone IPA
        script: |
          xcode-project build-ipa --project TextHarbor.xcodeproj --scheme TextHarbor
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
